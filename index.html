<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Runs before first paint so the correct theme is applied with no flash.
      (function () {
        var override = new URLSearchParams(location.search).get('theme')
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          override === 'dark' ||
          (override !== 'light' &&
            (stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches))
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()

      // A reload should start at the top, not at the #section that was clicked last.
      // Runs before the browser's fragment scroll so there is no visible jump.
      if (
        location.hash &&
        (performance.getEntriesByType('navigation')[0]?.type ?? 'reload') === 'reload'
      ) {
        history.replaceState(null, '', location.pathname + location.search)
      }
    </script>
