services:
  - type: web
    name: naveen-portfolio
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      # Retired routes from the previous single-page portfolio -> anchors on /
      - type: redirect
        source: /about
        destination: /#about
      - type: redirect
        source: /skills
        destination: /#stack
      - type: redirect
        source: /experience
        destination: /#experience
      # Next.js static export writes directory indexes (projects/index.html,
      # contact/index.html). Normalise the old slashless URLs to the exported
      # trailing-slash form; Render serves the directory index for those.
      - type: redirect
        source: /projects
        destination: /projects/
      - type: redirect
        source: /contact
        destination: /contact/
